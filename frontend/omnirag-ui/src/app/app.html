@if (showShell()) {
  <div class="min-h-screen bg-base-200">
    <header class="navbar sticky top-0 z-50 bg-base-100 shadow-sm">
      <div class="navbar-start">
        <button
          type="button"
          class="btn btn-ghost lg:hidden"
          aria-label="Toggle menu"
          (click)="toggleMobileMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <a class="btn btn-ghost text-xl" routerLink="/dashboard">
          OmniRAG
        </a>
      </div>

      <div class="navbar-center hidden lg:flex">
        <ul class="menu menu-horizontal px-1">
          <li>
            <a routerLink="/dashboard" routerLinkActive="active">
              Dashboard
            </a>
          </li>
          <li>
            <a routerLink="/documents" routerLinkActive="active">
              Documents
            </a>
          </li>
          <li>
            <a routerLink="/chatbot" routerLinkActive="active">
              Chatbot
            </a>
          </li>
        </ul>
      </div>

      <div class="navbar-end hidden lg:flex gap-2">
        <div class="text-right mr-2">
          <div class="text-sm font-medium">{{ userEmail() }}</div>
          <div class="text-xs opacity-70">{{ userRole() }}</div>
        </div>

        <button type="button" class="btn btn-outline btn-sm" (click)="signOut()">
          Logout
        </button>
      </div>
    </header>

    @if (mobileMenuOpen) {
      <div class="lg:hidden bg-base-100 border-b border-base-300 shadow-sm">
        <ul class="menu menu-lg p-4 gap-2">
          <li>
            <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMobileMenu()">
              Dashboard
            </a>
          </li>
          <li>
            <a routerLink="/documents" routerLinkActive="active" (click)="closeMobileMenu()">
              Documents
            </a>
          </li>
          <li>
            <a routerLink="/chatbot" routerLinkActive="active" (click)="closeMobileMenu()">
              Chatbot
            </a>
          </li>

          <li class="pt-2 border-t border-base-300">
            <div class="px-2 pb-2 text-sm font-medium">{{ userEmail() }}</div>
            <div class="px-2 pb-2 text-xs opacity-70">{{ userRole() }}</div>
            <button type="button" class="btn btn-outline btn-block" (click)="signOut()">
              Logout
            </button>
          </li>
        </ul>
      </div>
    }

    <main class="min-h-[calc(100vh-4rem)]">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <main class="min-h-screen bg-base-200">
    <router-outlet></router-outlet>
  </main>
}
