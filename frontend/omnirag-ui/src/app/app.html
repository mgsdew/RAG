<div class="app-shell">
<header *ngIf="isAuth" class="topbar">
  <nav class="topbar-nav">
    <div class="topbar__left">
      <a class="topbar__link" routerLink="/dashboard">Dashboard</a>
      <a class="topbar__link" routerLink="/documents">Documents</a>
      <a class="topbar__link" routerLink="/chatbot">Chatbot</a>
    </div>
    <div class="topbar__right">
      <span class="topbar__user" *ngIf="username"> {{ username }}</span>
      <span class="topbar__role" *ngIf="rolesText">({{ rolesText }})</span>
      <button type="button" class="btn-info" (click)="logout()">Sign out</button>
    </div>
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
</div>
